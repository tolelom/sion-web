name: Sion Frontend CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 계약 타입 확인
        run: npm run contract:check

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      - name: QEMU 설정
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx 설정
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tolelom/sion:latest
            ghcr.io/tolelom/sion:main
          platforms: linux/arm64
